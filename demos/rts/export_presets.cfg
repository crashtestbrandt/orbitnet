; Export presets for the RTS demo.
;
; Two Linux presets ship here -- a client and a dedicated server -- because those are the two CI can build
; and the two the deploy story needs. Windows and macOS presets are the same shape with a different
; `platform`/`export_path`; add them the same way, and add the matching binary to addons/orbitnet_native/bin
; (see release.yml).
;
; THE SERVER PRESET'S `custom_features="dedicated_server"` IS LOAD-BEARING. rts_main.gd checks
; OS.has_feature("dedicated_server") and boots authoritative with NO command-line argument, which is what
; makes the server image deployable: an operator runs the binary, not a command line.
;
; Both presets `include_filter` the extension binaries explicitly. Godot exports a .gdextension's declared
; libraries automatically, but the filter is cheap insurance against a future path change silently shipping a
; client that cannot load its own netcode.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="addons/orbitnet_native/bin/*"
exclude_filter="tools/*, tests/*"
export_path="../../build/rts-linux/orbitnet-rts.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.1]

name="Linux Server"
platform="Linux"
runnable=true
dedicated_server=true
custom_features="dedicated_server"
export_filter="all_resources"
include_filter="addons/orbitnet_native/bin/*"
exclude_filter="tools/*, tests/*"
export_path="../../build/rts-server/orbitnet-rts-server.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
