[workspace]
resolver = "2"
members = ["crates/orbitnet-core", "crates/orbitnet-godot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crashtestbrandt/orbitnet"
description = "OrbitNet — rollback netcode for Godot 4, in Rust"

[workspace.dependencies]
orbitnet-core = { path = "crates/orbitnet-core" }

# Release binaries ship inside the game export, so favour size + speed over build time.
# `panic = "abort"` is deliberately NOT set: gdext maps Rust panics onto Godot errors, and a
# GDExtension that aborts takes the whole editor with it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local native-profiler exports use the same optimizer/LTO settings as shipping, but retain enough
# DWARF for perf/Hotspot to attribute OrbitNet frames to Rust functions and source lines. This
# profile is published as a release asset and swapped in by a developer under a profile-only directory;
# shipping uses `[profile.release]` above. Nothing here is committed or LFS-managed.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

# The build Godot loads whenever a project runs FROM SOURCE -- every CI probe, every two-peer probe,
# every editor run. It inherits `release`, so it is NOT the 10-50x slower cargo debug build: the
# optimizer settings, the strip and the debug level are all unchanged, and ONLY the checks differ.
#
# `debug-assertions` is what makes `debug_assert!` reachable at all. Measured: with the codec's
# declared-size check deliberately falsified, `--release` passes 189/189 silently and this profile
# fails 2 of them. That check is the encoder agreeing with itself about how many bytes it wrote, and
# disagreement there corrupts a delta chain.
#
# `overflow-checks` follows it. Cargo defaults it to the same value; it is stated rather than
# inherited so a future edit to one is a deliberate edit to both. The one site that wraps by design
# is FNV-1a, which already uses `wrapping_mul` explicitly.
#
# NOT symbolized, deliberately. `debug = 1` / `strip = "none"` here measured 16.6 MB against release's
# 4.0 MB, and this is a build every project run from source loads. Stripped, the whole cost of the
# checks is ~0.4 MB.
# Symbolized builds are what `[profile.profiling]` below is for.
[profile.template-debug]
inherits = "release"
debug-assertions = true
overflow-checks = true
