[workspace]
resolver = "2"
members = ["crates/orbitnet-core", "crates/orbitnet-godot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crashtestbrandt/orbitnet"
description = "OrbitNet — rollback netcode for Godot 4, in Rust"

[workspace.dependencies]
orbitnet-core = { path = "crates/orbitnet-core" }

# Release binaries ship inside the game export, so favour size + speed over build time.
# `panic = "abort"` is deliberately NOT set: gdext maps Rust panics onto Godot errors, and a
# GDExtension that aborts takes the whole editor with it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local native-profiler exports use the same optimizer/LTO settings as shipping, but retain enough
# DWARF for perf/Hotspot to attribute OrbitNet frames to Rust functions and source lines. This
# profile is staged under an ignored profile-only addon directory by `just profile-native`; shipping uses
# `[profile.release]` above and its stripped, LFS-managed binaries.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
