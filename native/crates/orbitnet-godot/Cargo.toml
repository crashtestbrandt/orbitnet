[package]
name = "orbitnet-godot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OrbitNet — Godot 4 GDExtension binding"

[lib]
# The GDExtension itself. The name drives the shared-library filename referenced by
# addon/orbitnet.gdextension.
name = "orbitnet"
crate-type = ["cdylib"]

[dependencies]
orbitnet-core = { workspace = true }

# Built against the 4.4 API rather than 4.7. gdext extensions load in any Godot at or above the API
# they were built against, so a 4.4 baseline runs on any newer editor while staying usable by projects
# on older 4.x. It also avoids the `api-custom` feature, which would drag libclang/bindgen into every
# dev environment for no benefit here.
#
# Pinned exactly, not with a caret: gdext is 0.x and its API moves between releases.
#
# Full codegen (the default) is kept deliberately. Trimming it builds faster but drops classes
# outside the core set, and the next milestone needs `SceneMultiplayer` — which is exactly the kind
# of class a lean build omits.
godot = { version = "=0.5.4", features = ["api-4-4"] }

# The persistent worker pool behind per-peer frame assembly (`orbit_net.rs`, `assemble_frames`), used at
# `orbitnet/assembly_pool_peers` synced peers and above.
#
# - Licence: `MIT OR Apache-2.0`, and so are the five crates it pulls (`rayon-core`, `crossbeam-deque`,
#   `crossbeam-epoch`, `crossbeam-utils`, `either`). Their `THIRD_PARTY.md` rows land in the same commit.
# - Why not hand-written: each flush lends the pool's threads borrowed frame data. Threads that persist
#   across flushes can hold a borrow only through `unsafe` lifetime erasure, or by copying every entity's
#   history each flush. `rayon`'s scope is the reviewed form of the first.
# - Why persistent: threads spawned per flush need none of that, and measured 60 to 100 us a flush slower,
#   starting every flush on a cold allocator.
# - Below the threshold the pool is never built, so a small session starts no threads.
rayon = "1.12"

# POSIX signal handling for the native crash handler (crash.rs). Already in the tree transitively via
# godot-ffi, so making it direct pulls nothing new; Windows uses raw `extern "system"` kernel32
# declarations instead of a second dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
