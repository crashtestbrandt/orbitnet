[package]
name = "orbitnet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OrbitNet core — engine-agnostic rollback netcode primitives"

# No dependency on `godot`, and no `Variant` in any signature. Everything here is a pure function of plain
# data, so it runs under `cargo test` in milliseconds and can be reused outside Godot. That is the boundary,
# and it does not move.
#
# A vetted cryptographic dependency is allowed here. `[dependencies]` held nothing until the two entries
# below, and that emptiness described the crate. It had been read as a rule, and under that reading the only
# way to add a cipher or a key exchange was to hand-write it. That is settled: an audited implementation is
# preferred to a hand-written one, and the list vetoes nothing.
#
# What that changes. An AEAD or a key exchange is ordinary work against a reviewed implementation, where it
# used to cost several hundred lines of hand-written constant-time field arithmetic in a crate whose only
# constant-time groundwork is a ten-line tag compare. That cost was the argument for declining X25519, and the
# argument was the rule. The exchange below is the first item to be built that way.
#
# What a dependency here has to clear. A runtime dependency ships inside every export, which the
# `[dev-dependencies]` entry below does not, so it answers for more:
#   * A licence from the set CONTRIBUTING.md names -- MIT / Apache-2.0 / BSD / MPL-2.0 -- and a
#     `THIRD_PARTY.md` row with it, in the same commit.
#   * A reason the hand-written version would be worse. That is the whole point of the change; a dependency
#     taken to save typing is not what this settled.
#   * The millisecond test run, which is worth keeping. A build script or a proc-macro tree costs more than
#     its own compile time.
#   * The engine boundary above, which nothing may cross.
#
# Hand-written SipHash-2-4 in `auth.rs` stays. It is ~40 lines, a keyed PRF with no table lookups and no
# secret-dependent branches, already here, and already held to constant time by `tests/constant_time.rs`.
# That shape generalises to a stream cipher and not to an elliptic curve, which is why it was affordable
# under the rule and why it does not need replacing now the rule is gone.
[dependencies]
# The **payload cipher**: ChaCha20-Poly1305 (RFC 8439), which `auth.rs` runs over every datagram of a
# session that configured a secret. The first runtime dependency this crate has taken, against the four
# points above:
#
#   * **Licence.** `Apache-2.0 OR MIT`, and so is every one of the thirteen crates it pulls. Their
#     `THIRD_PARTY.md` rows land in the same commit.
#   * **Why not hand-written.** An AEAD is a cipher and a universal hash wired together, and the wiring is
#     where this design fails quietly: a Poly1305 written here would carry its own 130-bit field
#     arithmetic and its own constant-time tag compare, and a nonce or a length-encoding mistake produces
#     ciphertext that decrypts correctly at both ends and leaks anyway. The ChaCha20 half is close to the
#     shape that made SipHash affordable; the Poly1305 half is not, and taking half an AEAD is not an
#     option. This implementation has been reviewed and carries RFC 8439's own test vectors.
#   * **The millisecond test run.** Fourteen crates in the runtime tree, no build script, no
#     proc-macro, no `syn`. Measured cold at about 2 s of the workspace's build; `cargo test
#     -p orbitnet-core` runs in about 1 s, which is what it ran in before the dependency.
#   * **The engine boundary.** It names no `godot` type and no `Variant`. Keys and nonces are `[u8; N]`
#     arrays and the API is a pure function of them.
#
# `default-features = false` drops `alloc` and `getrandom`. The in-place, detached-tag API needs neither:
# the caller supplies the buffer, and every nonce here is derived rather than drawn. That keeps the
# platform-backend crates `getrandom` would add out of the tree entirely.
chacha20poly1305 = { version = "0.11", default-features = false }

# X25519, for the authenticated key exchange in `auth.rs`. The first entry in this list, and it clears the
# four points above:
#
#   * BSD-3-Clause, and so is everything it pulls that is not MIT / Apache-2.0. `THIRD_PARTY.md` carries the
#     rows.
#   * The hand-written version would be worse, and by a wide margin. Curve25519 is constant-time field
#     arithmetic over a 255-bit prime -- roughly 400 lines here, none of it reviewable by anyone working on
#     this repository, in a crate whose only constant-time groundwork is a ten-line tag compare.
#     `tests/constant_time.rs` covers that compare and says in its own header that arithmetic written later
#     needs its own coverage. This is the case the settled rule was settled for.
#   * The test run stays in milliseconds; what this costs is a one-off build. `curve25519-dalek` carries a
#     build script (`rustc_version` -> `semver`) that picks its arithmetic backend from the target, and on
#     **x86-64 only** it also pulls the `curve25519-dalek-derive` proc-macro and `cpufeatures` for the simd
#     backend. On aarch64 it builds neither. That is a proc-macro on one of the two architectures this
#     ships for, and it was weighed against writing the curve by hand.
#   * It touches no engine type, so the boundary this crate is held to is intact: no `godot`
#     dependency, no `Variant` in any signature, and `#![forbid(unsafe_code)]` still on the crate.
#     `x25519-dalek` is `#![no_std]` itself and carries no engine type of its own.
#
# Features, all three defaults off:
#   * `static_secrets` gives `StaticSecret`, the only secret type constructible from bytes. Randomness is
#     drawn by the host engine and handed in, which is what keeps `getrandom` out of this tree.
#   * `zeroize` wipes secret material on drop.
#   * `precomputed-tables` is OFF. It trades a table of precomputed curve points, shipped inside every
#     export, for a faster basepoint multiply. This crate does two of those per join and none at rest.
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }

# The generator behind `tests/wire_properties.rs`. A `[dev-dependencies]` entry is compiled for
# `cargo test` and for nothing else: it is absent from `cargo build`, from the cdylib `orbitnet-godot`
# links, and from every release asset, so it changes nothing about what ships. It therefore answers for
# less than the runtime entry above, and `THIRD_PARTY.md` keeps the two trees in separate tables.
#
# Default features off. `fork` and `timeout` run each case in a subprocess to survive an abort or a
# hang; this crate is `#![forbid(unsafe_code)]`, so a failing case panics and `std`'s own
# `catch_unwind` already reports it, and the two features would add `rusty-fork`, `wait-timeout` and
# `tempfile` to the dev tree for nothing. `bit-set` only picks a faster shrinker for
# `proptest::sample`, which this suite does not use.
[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
