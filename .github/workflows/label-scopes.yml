# COPY -- DO NOT EDIT HERE.
#
# Source of truth: crashtestbrandt/spaceman, .github/workflows/label-scopes.yml. This file is copied into
# every repo .github/labels.yml names, because enforcement answers `issues.labeled` and a workflow in
# spaceman never sees this repo's events.
#
# EXCLUSIVE_SCOPES below must match spaceman's labels.yml. spaceman's own gate (tools/check-labels.sh) can
# only see spaceman's copy, so when a scope's exclusivity changes, every copy has to be updated together.
# Re-copy from spaceman rather than editing the value here. docs/labels.md in spaceman is the authority.
#
name: Label scopes

# GitLab's scoped-label rule, rebuilt on GitHub: an issue carries at most one member of an EXCLUSIVE scope,
# and applying one removes its siblings.
#
# WHY IT LIVES IN EACH REPO RATHER THAN BESIDE label-sync.yml. Enforcement is event-driven -- it answers
# `issues.labeled` -- and a workflow in spaceman never sees another repo's events. A central scheduled sweep
# was the alternative and it is worse: minutes of latency, and a label the user just applied vanishing under
# them. So this file is COPIED INTO each repo labels.yml names. docs/labels.md, "Installing enforcement".
#
# It needs no secret. It edits issues in its OWN repo, which the built-in GITHUB_TOKEN can do, and a label
# removed by GITHUB_TOKEN raises no further workflow run, so there is no loop to guard against.
#
# EXCLUSIVE_SCOPES IS GENERATED. It is `ruby tools/label-plan.rb --exclusive-scopes` over spaceman's
# .github/labels.yml, and tools/check-labels.sh fails the PR when this literal and that file disagree. It is a
# literal rather than a read of labels.yml because the sibling repos do not carry that file.
#
# IT IS EMPTY TODAY. The only declared scope, `topic`, is non-exclusive -- an issue can be about the scripting
# layer and about performance at once. Every step below no-ops until a scope declares `exclusive: true`, which
# is a one-line change in labels.yml.

# `pull_request_target` runs with write permissions against the BASE repo, which is only safe because this
# job never checks out the pull request's code -- there is no `actions/checkout` below, and the only input it
# reads is the event's label name. Do not add a checkout here.
on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write

# Two labels applied at once fire two runs. Serializing per issue keeps the second from reading the label set
# the first is still editing.
concurrency:
  group: label-scopes-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  EXCLUSIVE_SCOPES: ""

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Strip siblings of the applied label's scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLIED: ${{ github.event.label.name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${EXCLUSIVE_SCOPES// /}" ]; then
            echo "No exclusive scopes declared; nothing to enforce."
            exit 0
          fi
          case "$APPLIED" in
            *::*) ;;
            *) echo "'$APPLIED' is not scoped; nothing to enforce."; exit 0 ;;
          esac

          scope="${APPLIED%%::*}"
          exclusive=0
          for s in $EXCLUSIVE_SCOPES; do
            [ "$s" = "$scope" ] && exclusive=1
          done
          if [ "$exclusive" -ne 1 ]; then
            echo "Scope '$scope' is not exclusive; nothing to enforce."
            exit 0
          fi

          # Re-read the live label set rather than trusting the event payload: by the time this runs, another
          # run may already have changed it.
          #
          # `gh issue` on a PULL REQUEST number is correct, not an oversight: every GitHub pull request is an
          # issue, and both `gh issue view` and `gh issue edit --remove-label` resolve a PR number and act on
          # it. Verified against a live PR rather than assumed (PR #1191). Do not "fix" this into a
          # gh pr / gh issue branch on github.event_name.
          current="$(gh issue view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')"

          # The label just applied is the winner, which is GitLab's rule. Everything else in its scope goes.
          printf '%s\n' "$current" | while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" != "$APPLIED" ] || continue
            case "$name" in
              "$scope"::*) ;;
              *) continue ;;
            esac
            echo "Removing '$name' (sibling of '$APPLIED' in exclusive scope '$scope')"
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label "$name" < /dev/null
          done
