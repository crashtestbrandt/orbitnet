name: binaries

# Build the extension for all three platforms whenever the Rust changes, and upload the results as
# workflow ARTIFACTS. It commits nothing.
#
# NO BINARY IS COMMITTED TO THIS REPOSITORY at all -- not on a push, not on a tag. `release.yml` commits
# a sha256 MANIFEST and attaches the bytes to the GitHub Release. This workflow is what keeps that safe:
# main is always PROVEN to build on every platform, even though nothing in the tree carries the result.
#
# Both descriptor profiles per platform, because they are different builds and only one of them is what a
# project running from source loads. See tools/build-native.sh.

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'tools/build-native.sh'
      - '.github/workflows/binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is what tools/build-native.sh is called with, and what
          # tools/check-descriptor-parity.sh looks for to prove every platform the script knows has a leg
          # that runs it.
          #
          # Pushes to main and workflow_dispatch both require write access to this repository, unlike
          # check.yml's pull_request gate -- see that file's header for why THAT one must stay
          # GitHub-hosted. There is no fork-PR path into this workflow, so the self-hosted fleet is safe
          # here.
          - platform: linux
            runner: [self-hosted, Linux, X64, legion]
          - platform: windows
            runner: [self-hosted, Windows, X64, legion-win]
          - platform: macos
            runner: [self-hosted, macOS, ARM64, legion-mac]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.platform }}

      # One script for both workflows and all three platforms. macOS cross-builds both architectures and
      # lipos them per profile; legion-mac is ARM64, but that is only the HOST.
      - name: Build both descriptor profiles
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-${{ matrix.platform }}
          path: staged/
          retention-days: 30
