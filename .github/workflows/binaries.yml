name: binaries

# Build the extension for all three platforms whenever the Rust changes, and upload the results as
# workflow ARTIFACTS. It commits nothing.
#
# NO BINARY IS COMMITTED TO THIS REPOSITORY at all -- not on a push, not on a tag. `release.yml` commits
# a sha256 MANIFEST and attaches the bytes to the GitHub Release. This workflow is what keeps that safe:
# main is always PROVEN to build on every platform, even though nothing in the tree carries the result.
#
# Both descriptor profiles per platform, because they are different builds and only one of them is what a
# project running from source loads. See tools/build-native.sh.

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'tools/build-native.sh'
      - '.github/workflows/binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is what tools/build-native.sh is called with, and what
          # tools/check-descriptor-parity.sh looks for to prove every platform the script knows has a leg
          # that runs it.
          #
          # Pushes to main and workflow_dispatch both require write access to this repository, unlike
          # check.yml's pull_request gate -- see that file's header for why THAT one must stay
          # GitHub-hosted. There is no fork-PR path into this workflow, so the self-hosted fleet is safe
          # here.
          - platform: linux
            runner: [self-hosted, Linux, X64, legion]
          - platform: windows
            runner: [self-hosted, Windows, X64, legion-win]
          - platform: macos
            runner: [self-hosted, macOS, ARM64, legion-mac]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # SELF-HOSTED WINDOWS: rustup is on PATH but its SHIM DIRECTORY is not, so `rustup toolchain
      # install` and `rustup default` both succeed while `rustc` is not found. dtolnay/rust-toolchain
      # only repairs PATH when it installs rustup itself, so on a box where rustup is already present
      # the failure surfaces inside the action's own cachekey step as "rustc: command not found" --
      # which reads like a missing toolchain rather than a missing PATH entry.
      #
      # The SHIM directory, not the toolchain's own bin: the shims are what honour
      # native/rust-toolchain.toml. Putting the toolchain bin on PATH instead would silently ignore the
      # pin.
      - name: Put the rustup shims on PATH
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustc >/dev/null 2>&1; then
            echo "rustc already resolves: $(command -v rustc)"
            exit 0
          fi
          for dir in \
            "$(command -v rustup >/dev/null 2>&1 && dirname "$(command -v rustup)" || true)" \
            "${CARGO_HOME:-}/bin" \
            "${USERPROFILE:-}/.cargo/bin"
          do
            [ -n "$dir" ] || continue
            if [ -x "$dir/rustc.exe" ] || [ -x "$dir/rustc" ]; then
              echo "found the rustc shim in $dir"
              echo "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::no rustc shim on this runner. rustup=$(command -v rustup || echo none), CARGO_HOME=${CARGO_HOME:-unset}. Reinstall rustup for the account the runner service runs as."
          exit 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.platform }}

      # One script for both workflows and all three platforms. macOS cross-builds both architectures and
      # lipos them per profile; legion-mac is ARM64, but that is only the HOST.
      - name: Build both descriptor profiles
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-${{ matrix.platform }}
          path: staged/
          retention-days: 30
