name: binaries

# Build the extension for every platform leg whenever the Rust changes, and upload the results as
# workflow ARTIFACTS. It commits nothing.
#
# NO BINARY IS COMMITTED TO THIS REPOSITORY at all -- not on a push, not on a tag. `release.yml` commits
# a sha256 MANIFEST and attaches the bytes to the GitHub Release. This workflow is what keeps that safe:
# main is always PROVEN to build on every platform, even though nothing in the tree carries the result.
#
# Both descriptor profiles per platform, because they are different builds and only one of them is what a
# project running from source loads. See tools/build-native.sh.

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'tools/build-native.sh'
      - '.github/workflows/binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is what tools/build-native.sh is called with, and what
          # tools/check-descriptor-parity.sh looks for to prove every platform the script knows has a leg
          # that runs it.
          #
          # Pushes to main and workflow_dispatch both require write access to this repository, unlike
          # check.yml's pull_request gate -- see that file's header for why THAT one must stay
          # GitHub-hosted. There is no fork-PR path into this workflow, so the self-hosted fleet is safe
          # here.
          - platform: linux
            runner: [self-hosted, Linux, X64, legion]
          # LINUX ARM64 CROSS-COMPILES ON THE x86_64 BOX. Same runner labels as the leg above,
          # `aarch64-unknown-linux-gnu` as the cargo target, no arm64 hardware anywhere. It is its own
          # leg because tools/build-native.sh maps one platform key onto one shipped filename and
          # tools/check-descriptor-parity.sh proves every key has a leg that runs it. The box needs an
          # aarch64 linker (`gcc-aarch64-linux-gnu`); the build refuses to start without one.
          - platform: linux_arm64
            runner: [self-hosted, Linux, X64, legion]
          - platform: windows
            runner: [self-hosted, Windows, X64, legion-win]
          - platform: macos
            runner: [self-hosted, macOS, ARM64, legion-mac]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # NO dtolnay/rust-toolchain AND NO Swatinem/rust-cache ON THE SELF-HOSTED LEGS. Both exist to
      # provision a fresh hosted runner. These boxes already carry rustup and a persistent `target/`
      # directory, and both actions run `rustc` directly to build a cache key -- which is how a box whose
      # rustup SHIMS had gone missing failed here with "rustc: command not found" while `rustup toolchain
      # install` and `rustup default` both reported success. check.yml keeps the actions: it runs on
      # GitHub-hosted runners that genuinely start empty.
      #
      # `cargo` is what the build invokes, and the rustup cargo shim points rustc at the toolchain itself,
      # so cargo resolving is the condition that matters. native/rust-toolchain.toml pins the version;
      # rustup honors it from inside that directory with no help from CI.
      - name: Check the Rust toolchain on this runner
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            "$(command -v rustup >/dev/null 2>&1 && dirname "$(command -v rustup)" || true)" \
            "${CARGO_HOME:-}/bin" \
            "${USERPROFILE:-}/.cargo/bin" \
            "$HOME/.cargo/bin"
          do
            [ -n "$dir" ] && [ -d "$dir" ] || continue
            echo "-- $dir"
            ls -l "$dir" || true
            case ":$PATH:" in *":$dir:"*) ;; *) echo "$dir" >> "$GITHUB_PATH" ;; esac
            break
          done
          if ! command -v cargo >/dev/null 2>&1; then
            # THE RUSTUP PROXIES ARE MISSING, NOT THE TOOLCHAIN. rustup installs `cargo`, `rustc` and the
            # rest as copies of rustup.exe in the same directory; when those are deleted, `rustup` still
            # answers and reports its toolchains while nothing else on PATH exists. Observed on a runner
            # whose .cargo/bin held rustup.exe and nothing else.
            #
            # `rustup self update` reinstalls the proxies, which is the sanctioned repair. If it cannot
            # (offline, or a rustup installed by a package manager), the proxies are recreated directly --
            # copying rustup.exe under each name is exactly what rustup does internally.
            rustup_bin="$(command -v rustup || true)"
            if [ -z "$rustup_bin" ]; then
              echo "::error::neither cargo nor rustup is on this runner. Install rustup for the account the runner service runs as."
              exit 1
            fi
            bindir="$(dirname "$rustup_bin")"
            echo "::warning::cargo is missing from ${bindir}; repairing the rustup proxies"
            rustup self update || echo "rustup self update did not run; recreating the proxies directly"
            if ! command -v cargo >/dev/null 2>&1; then
              ext=""
              case "$rustup_bin" in *.exe) ext=".exe" ;; esac
              for tool in cargo rustc rustdoc rustfmt cargo-fmt cargo-clippy clippy-driver; do
                [ -e "${bindir}/${tool}${ext}" ] || cp "$rustup_bin" "${bindir}/${tool}${ext}"
              done
              chmod 0755 "${bindir}"/* 2>/dev/null || true
              hash -r 2>/dev/null || true
            fi
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo still does not resolve after repair. rustup=$(command -v rustup || echo none). Reinstall rustup for the account the runner service runs as."
            exit 1
          fi
          echo "cargo: $(command -v cargo)"
          # From inside native/, so the versions printed are the ones rust-toolchain.toml pins. `rustc`
          # is reported and not required: the rustup cargo shim resolves rustc for its own children, so a
          # missing rustc shim does not stop a build -- it only stops a step that runs rustc directly.
          ( cd native && cargo --version )
          ( cd native && rustc --version ) || echo "rustc does not resolve directly; cargo will resolve it"


      # One script for both workflows and every platform key. Two of those keys are cross builds on a host
      # of another architecture: macOS builds both architectures and lipos them per profile (legion-mac is
      # ARM64, but that is only the HOST), and `linux_arm64` targets aarch64 from the x86_64 box.
      - name: Build both descriptor profiles
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-${{ matrix.platform }}
          path: staged/
          retention-days: 30

      # =================================================================================================
      # WINDOWS AND MACOS RUN A TEST HERE, AND NOWHERE ELSE.
      #
      # Both legs used to compile the library, upload it and stop, so a release shipped two platforms on
      # which no unit suite, no probe and no load smoke had ever run. `check.yml` runs all of its jobs on
      # `ubuntu-latest` and its own header says it cannot speak for the other two. The failure that leaves
      # open is the one the .gdextension header describes for a bad `[libraries]` entry: it fails at
      # `dlopen` on the affected platform and nowhere else, so every Linux gate stays green while a
      # Windows checkout takes the `Net` autoload down.
      #
      # AFTER THE UPLOAD, deliberately. The artifact is what you need in order to debug a smoke failure, so
      # it is published before anything can fail.
      #
      # THE LINUX LEG SKIPS ALL OF THIS. check.yml's `godot` job already runs the load smoke and the four
      # unit suites on Linux for every pull request; repeating them here would buy nothing and would need
      # Godot installed on a third box.
      # =================================================================================================
      - name: Check Godot on this runner
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Named separately from the steps that use it so an absent Godot reports what to install rather
          # than surfacing as `godot: command not found` inside a test script. GODOT_BIN is the same
          # override tools/godot-quiet.sh honors, so a runner with Godot somewhere non-standard sets that
          # one variable and every step below follows.
          bin="${GODOT_BIN:-godot}"
          if ! command -v "$bin" >/dev/null 2>&1; then
            echo "::error::Godot is not installed for this ${{ matrix.platform }} runner: '$bin' does not resolve on PATH."
            echo "This leg runs the extension load smoke and the unit suites, both of which need the Godot"
            echo "editor binary (headless is enough). Install Godot 4.4 or newer for the account the runner"
            echo "service runs as and put it on PATH as 'godot', or set GODOT_BIN to its full path."
            exit 1
          fi
          echo "godot: $(command -v "$bin")"
          "$bin" --version

      # The smoke loads what the build step produced, so the staged libraries are copied where the
      # .gdextension resolves them and `--skip-build` is passed. Building a second copy into bin/ would
      # compile the same two profiles again and prove less: it would no longer be the uploaded artifact
      # under test.
      - name: Install the freshly built library where the descriptor resolves it
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p addons/orbitnet_native/bin
          for name in $(tools/build-native.sh names ${{ matrix.platform }}); do
            cp "staged/$name" "addons/orbitnet_native/bin/$name"
          done
          # The unit suites run inside harness/ and the three demos, and every one of those projects gets
          # its addon as a gitignored COPY. Nothing in a fresh checkout has them until this runs.
          tools/sync-addons.sh

      # Magic bytes, the entry symbol, then a throwaway Godot project that asserts the classes register,
      # exported properties bind, signals reach GDScript, ticks advance, and freeing a registered entity
      # does not panic the frame. See the script header for which half proves what.
      - name: Extension load smoke (throwaway project)
        if: matrix.platform != 'linux'
        shell: bash
        run: tools/orbitnet-smoke.sh --skip-build

      # The cheap second layer is the addon's own GDScript, on this platform, with no scene tree, no
      # physics and no sockets. The probes are the expensive third layer and are deliberately not here --
      # they are multi-process, they bind UDP ports, and they are slow.
      - name: Unit suites
        if: matrix.platform != 'linux'
        shell: bash
        run: |
          set -euo pipefail
          godot="${GODOT_BIN:-godot}"
          # macOS headless creates a Metal RenderingDevice during the resource import pass and can fault
          # inside MoltenVK there, regardless of --headless and regardless of --rendering-driver.
          # tools/lint-gdscript.sh carries these two arguments for that exact fault and runs every pass
          # with them; this leg does the same. They word-split to nothing on Windows.
          render_args=""
          if [ "$(uname)" = "Darwin" ]; then
            render_args="--rendering-driver opengl3 --audio-driver Dummy"
          fi
          for project in harness demos/rts demos/hockey demos/arena; do
            # PRIME THE IMPORT CACHE FIRST. A cold project has no global class cache, so the runner script
            # fails to resolve the test base class it extends -- "Could not find type" on correct code that
            # loads fine on the next run. `.gitignore` ignores `.godot/` and actions/checkout removes
            # ignored files, so EVERY run here is cold and this prime is load-bearing on all of them.
            # Best-effort but retried once: a real script error recurs on the checked pass below, while a
            # renderer fault part way through leaves a half-built class cache that the checked pass has no
            # fallback for.
            "$godot" --headless --no-header $render_args --path "$project" --import >/dev/null 2>&1 \
              || "$godot" --headless --no-header $render_args --path "$project" --import >/dev/null 2>&1 \
              || true
            "$godot" --headless $render_args --path "$project" --script tests/support/run_unit_tests.gd
          done
