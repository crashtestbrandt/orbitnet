name: check

# The PR gate. Deliberately small and deliberately in this order: the gates that need no Godot at all run
# first, so the common failures report in seconds rather than after a Godot download.
#
# GITHUB-HOSTED RUNNERS, NOT SELF-HOSTED. A public repository must never point fork-PR CI at a self-hosted
# runner: a fork PR can change the workflow, and a self-hosted runner executes it on your machine with your
# filesystem. The cost is installing Godot per job, which the cache below makes cheap.
#
# `pull_request`, NOT `pull_request_target`, for the same family of reasons: fork PRs get no secrets and no
# write token, which is exactly right for a gate that only needs to read the diff.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1-stable

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Godot needed for any of these.
      # Called directly rather than through `just`: the recipes are one line each and a hosted runner has
      # no `just` installed, so adding one would be a dependency bought for nothing.
      #
      # --check-tracked, NOT --check. The synced copies are gitignored, so a fresh checkout has none, and
      # --check would correctly report every one of them "missing" -- it is a LOCAL gate against editing a
      # copy instead of the canonical source, and it needs the copies to exist. What can actually go wrong
      # in a COMMIT is that a copy was committed, creating a second source of truth; that is this gate.
      #
      # `addon-drift` is the one `just check` recipe this job omits, and the omission is deliberate: that
      # recipe diffs the synced copies against the canonical source, and the copies are gitignored, so a
      # fresh checkout has nothing to diff. The half of it a commit can actually break -- a copy committed
      # -- is the `--check-tracked` gate here. Do not "fix" the omission by adding the full drift check.
      - name: No synced addon copy is committed
        run: tools/sync-addons.sh --check-tracked

      - name: Facade boundary (net-check)
        run: tools/net-check.sh

      # A descriptor entry naming a library nothing builds fails at dlopen on that platform and nowhere
      # else, so every Linux gate stays green while a Windows checkout is broken. This compares the two
      # lists instead of testing for files CI cannot see.
      - name: Descriptor / build-matrix parity
        run: tools/check-descriptor-parity.sh

      # `tools/netbench/compare.py` judges every bench column. Its relative tolerances, its
      # `NOISE_FLOOR_ABS` absolute floors and its fault-counter handling are what separate a regression from
      # run-to-run noise, and `--self-test` asserts those verdicts against cases the script carries itself.
      # Standard library only, reads no bench artifacts, no Godot and no Rust -- which is why it belongs in
      # this job rather than the Godot one.
      - name: Bench comparator self-test
        run: python3 tools/netbench/compare.py --self-test

      # The negative control for the Asset Library zip check. It synthesizes an archive per failure class
      # -- a library the descriptor names removed, a library replaced by Git LFS pointer text, a missing
      # licence, the EditorPlugin script plugin.cfg names missing, a stray file, a nested addon copy --
      # and asserts each one is caught. Standard library
      # only, no Godot and no Rust, which is why it belongs in this job; the archive itself is assembled
      # and booted in the `godot` job below, where a library exists to package.
      - name: Asset Library zip check self-test
        run: tools/check-assetlib-zip.py --self-test

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: fmt
        run: cd native && cargo fmt --all --check
      - name: clippy
        run: cd native && cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cd native && cargo test --workspace

  godot:
    runs-on: ubuntu-latest
    needs: [gates, native]
    steps:
      - uses: actions/checkout@v4

      # This job builds the cdylib it loads, so it needs the toolchain. Its cache is its OWN, not the
      # `native` job's: rust-cache keys on the job id unless `shared-key` is set, and `key` only adds a
      # further discriminator. Sharing would not help anyway -- `native` compiles the dev profile for
      # clippy and tests, this job compiles `template-debug` and `release`, which are different target
      # directories with no artifact overlap.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: godot-gate

      - name: Cache the Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Put Godot on PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # The addon must be mirrored into each project before anything can load. Doing it here rather than
      # committing the copies is what keeps one canonical source in the tree.

      # THE GATE BUILDS THE LIBRARY IT LOADS. It used to load whatever binary happened to be committed,
      # which is how a stale one went unnoticed for three `native/**` commits: the Rust changed, the blob did
      # not, and every run was green against the old code. Building here means the GDScript under test and
      # the backend under test come from the same commit, always.
      #
      # BOTH descriptor profiles. Every step below runs a project from source, so Godot loads the
      # `template_debug` entry -- and that profile is the only one carrying `debug-assertions` and
      # `overflow-checks`, without which the workspace's `debug_assert!`s are compiled out of every
      # binary the gate has ever loaded. `template_release` is built here too because nothing else in a
      # PR compiles it: `cargo test` and `clippy --all-targets` both use the dev profile, so an LTO or
      # codegen failure in the shipping profile would surface at tag time. binaries.yml proves the other
      # two platforms; this job is Linux-only and cannot speak for them.
      - name: Build this commit's own cdylib
        run: tools/build-native.sh build linux addons/orbitnet_native/bin

      # After the build, so every project mirrors the freshly built bin/ rather than a stale copy.
      - name: Sync the addon into every project
        run: tools/sync-addons.sh

      - name: Confirm the extension binary is real (not a pointer, not empty)
        run: |
          set -euo pipefail
          # Every name this platform's descriptor entries resolve to, asked of the script that owns the
          # mapping. A `for` over the directory would pass vacuously if the build staged nothing.
          for name in $(tools/build-native.sh names linux); do
            lib="addons/orbitnet_native/bin/$name"
            test -s "$lib" || { echo "::error::$lib is missing or empty"; exit 1; }
            if head -c 64 "$lib" | grep -q 'git-lfs.github.com'; then
              echo "::error::$lib is a Git LFS POINTER, not a library. See the .gdextension header."
              exit 1
            fi
            magic="$(head -c 4 "$lib" | od -An -tx1 | tr -d ' \n')"
            test "$magic" = "7f454c46" || { echo "::error::$lib is not an ELF object (magic=$magic)"; exit 1; }
            ls -l "$lib"
          done

      - name: Lint (headless project load, warnings-as-errors)
        run: |
          tools/lint-gdscript.sh harness
          tools/lint-gdscript.sh demos/rts
          tools/lint-gdscript.sh demos/hockey
          tools/lint-gdscript.sh demos/arena

      - name: Unit suites
        run: |
          godot --headless --path harness --script tests/support/run_unit_tests.gd
          godot --headless --path demos/rts --script tests/support/run_unit_tests.gd
          godot --headless --path demos/hockey --script tests/support/run_unit_tests.gd
          godot --headless --path demos/arena --script tests/support/run_unit_tests.gd

      # --skip-build because the build already happened above; the smoke loads what that step installed
      # rather than compiling a second copy.
      - name: Extension load smoke (throwaway project)
        run: tools/orbitnet-smoke.sh --skip-build

      # The artifact a consumer installs, rather than the working tree every other step here loads. It is
      # assembled with tools/make-assetlib-zip.py the way release.yml assembles it, its contents are
      # asserted, and it is unpacked into a throwaway project that boots with the plugin enabled and the
      # `Net` autoload declared.
      #
      # Without --complete, because a pull request holds only the Linux libraries this job just built,
      # where the release runner holds every platform's. The half a pull request can actually break is the
      # packaging script, the descriptor and the addon layout, and this covers those; release.yml runs the
      # same script with --complete on the real zip before publishing it.
      - name: Asset Library zip installs into a clean project
        run: tools/check-assetlib-zip.py

      # First of the four probes. It binds no socket and costs about six seconds, and like the shape probe it
      # runs in the harness project, which contains no game: a failure there is the addon, where a failure in
      # a demo could be the demo's fault or the addon's. CONTRIBUTING.md records why it gates -- rollback
      # determinism is a line none of the other three probes reaches.
      - name: Cross-peer determinism probe (one tape, two peers, per-tick state)
        run: tools/determinism-probe.sh

      # Before the RTS probe because it runs in the harness project, which contains no game: a failure there
      # is the addon, where a failure in a demo could be the demo's fault or the addon's.
      - name: Server-shape probe (dedicated and listen, end to end)
        run: tools/server-shape-probe.sh

      - name: Two-peer RTS probe
        run: tools/rts-probe.sh

      # The fourth gating probe. It covers the interest axis no other probe reaches: membership filtering
      # across three worlds, a per-peer veto, several seats on one connection, a declared anchor, and a
      # session resume. CONTRIBUTING.md records why four probes gate rather than one.
      - name: Three-process arena probe
        run: tools/arena-probe.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            /tmp/rtsprobe-*
            /tmp/shapeprobe-*
            /tmp/arenaprobe-*
            /tmp/detprobe-*
            /tmp/orbitnet-lint*
          if-no-files-found: ignore
          retention-days: 7
