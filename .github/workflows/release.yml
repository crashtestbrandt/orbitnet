name: release

# Cut a release from a `v*` tag: build the extension on all three platforms, publish the binaries as
# Release assets, build the Asset Library zip, and commit a sha256 MANIFEST of what was published.
#
# NO BINARY IS COMMITTED, HERE OR ANYWHERE. What lands on main is `addons/orbitnet_native/binaries.json`
# -- the size and sha256 of every published asset, plus the version this tag stamped into plugin.cfg. A
# consumer pins the tag, downloads the assets and verifies them against a digest that lives in the commit
# graph, which a checksum file published beside the asset cannot do: that verifies transport, not tamper.
#
# The manifest is written AFTER the assets are built, so a tag commit cannot contain its own digest; main
# gets it one commit later. Harmless, because CI builds rather than fetches.
#
# THREE PROFILES. `template_debug` and `template_release` are what the .gdextension names and what the
# zip carries. `profiling` is a symbolized developer build, published as an asset only -- shipping it
# would put debug information nobody loads into every export. See tools/build-native.sh.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.2.0). Manual runs do not publish.'
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true   # a partial set of binaries must never be published
      matrix:
        include:
          # Tag pushes and workflow_dispatch both require write access to this repository, unlike
          # check.yml's pull_request gate -- see that file's header for why THAT one must stay
          # GitHub-hosted. There is no fork-PR path into this workflow, so the self-hosted fleet is safe
          # here.
          - platform: linux
            runner: [self-hosted, Linux, X64, legion]
          - platform: windows
            runner: [self-hosted, Windows, X64, legion-win]
          - platform: macos
            runner: [self-hosted, macOS, ARM64, legion-mac]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # NO dtolnay/rust-toolchain AND NO Swatinem/rust-cache ON THE SELF-HOSTED LEGS. Both exist to
      # provision a fresh hosted runner. These boxes already carry rustup and a persistent `target/`
      # directory, and both actions run `rustc` directly to build a cache key -- which is how a box whose
      # rustup SHIMS had gone missing failed here with "rustc: command not found" while `rustup toolchain
      # install` and `rustup default` both reported success. check.yml keeps the actions: it runs on
      # GitHub-hosted runners that genuinely start empty.
      #
      # `cargo` is what the build invokes, and the rustup cargo shim points rustc at the toolchain itself,
      # so cargo resolving is the condition that matters. native/rust-toolchain.toml pins the version;
      # rustup honours it from inside that directory with no help from CI.
      - name: Check the Rust toolchain on this runner
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            "$(command -v rustup >/dev/null 2>&1 && dirname "$(command -v rustup)" || true)" \
            "${CARGO_HOME:-}/bin" \
            "${USERPROFILE:-}/.cargo/bin" \
            "$HOME/.cargo/bin"
          do
            [ -n "$dir" ] && [ -d "$dir" ] || continue
            echo "-- $dir"
            ls -l "$dir" || true
            case ":$PATH:" in *":$dir:"*) ;; *) echo "$dir" >> "$GITHUB_PATH" ;; esac
            break
          done
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo does not resolve on this runner. rustup=$(command -v rustup || echo none). The rustup shims in .cargo/bin are missing -- reinstall rustup for the account the runner service runs as."
            exit 1
          fi
          echo "cargo: $(command -v cargo)"
          # From inside native/, so the versions printed are the ones rust-toolchain.toml pins. `rustc`
          # is reported and not required: the rustup cargo shim resolves rustc for its own children, so a
          # missing rustc shim does not stop a build -- it only stops a step that runs rustc directly.
          ( cd native && cargo --version )
          ( cd native && rustc --version ) || echo "rustc does not resolve directly; cargo will resolve it"


      - name: Build both descriptor profiles
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged

      # Separate directory, separate artifact: these must not reach the zip or the descriptor.
      - name: Build the symbolized profiling library
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged-profiling profiling

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-${{ matrix.platform }}
          path: staged/

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-profiling-${{ matrix.platform }}
          path: staged-profiling/

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, legion]
    permissions:
      contents: write   # the only place in this repo that needs it: commit the manifest + create a release
    steps:
      # THE TAG, not main. This job assembles the zip from the working tree, and the binaries it downloads
      # were built from the tag's sources -- so checking out main shipped a zip pairing the tag's backend
      # with whatever GDScript main had drifted to. The manifest commit below re-targets main explicitly
      # rather than relying on this checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: orbitnet-*
          path: incoming
          merge-multiple: false

      # bin/ is gitignored and empty in a fresh checkout, so this is what fills it.
      - name: Install the binaries
        run: |
          set -euo pipefail
          mkdir -p addons/orbitnet_native/bin profiling
          for p in linux windows macos; do
            cp incoming/orbitnet-$p/*            addons/orbitnet_native/bin/
            cp incoming/orbitnet-profiling-$p/*  profiling/
          done
          ls -l addons/orbitnet_native/bin profiling
          # A truncated download or an empty file here would publish a release that cannot load.
          for f in addons/orbitnet_native/bin/* profiling/*; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done

      # The bytes about to be published must be exactly the ones the descriptor names. A missing platform
      # or a renamed profile passes every Linux gate and fails at dlopen on a user's machine.
      - name: The published set is the set the descriptor names
        run: |
          set -euo pipefail
          named="$(grep -oE 'res://addons/orbitnet_native/bin/[^"]+' \
            addons/orbitnet_native/orbitnet.gdextension | sed 's|.*/||' | sort -u)"
          have="$(ls addons/orbitnet_native/bin | sort -u)"
          if ! diff <(printf '%s\n' "$named") <(printf '%s\n' "$have"); then
            echo "::error::the built set and the descriptor's set differ (< descriptor, > built)"
            exit 1
          fi
          echo "publishing exactly the $(printf '%s\n' "$named" | grep -c .) libraries the descriptor names"

      - name: Stamp the plugin version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
          fi
          sed -i "s/^version=\".*\"$/version=\"${version}\"/" addons/orbitnet/plugin.cfg
          grep '^version=' addons/orbitnet/plugin.cfg

      - name: Build the Asset Library zip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build
          # The payload is exactly the two addon directories -- what a user installs and nothing else.
          # The licences ride along inside it, because an addon installed from a zip carries no repository
          # with it and a user who cannot find the terms will assume the worst.
          cp LICENSE LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md addons/orbitnet/
          zip -qr "build/orbitnet-${version}.zip" addons/orbitnet addons/orbitnet_native
          rm -f addons/orbitnet/LICENSE addons/orbitnet/LICENSE-MIT \
                addons/orbitnet/LICENSE-APACHE addons/orbitnet/THIRD_PARTY.md
          # bin/ is gitignored, so `zip -r` on a clean checkout would silently ship an addon with no
          # backend at all. Prove the libraries are in there rather than trusting the glob.
          zipped="$(unzip -l "build/orbitnet-${version}.zip" | grep -c 'addons/orbitnet_native/bin/.' || true)"
          expected="$(ls addons/orbitnet_native/bin | grep -c .)"
          if [ "$zipped" -ne "$expected" ]; then
            echo "::error::the zip carries ${zipped} libraries; the descriptor needs ${expected}"
            exit 1
          fi
          unzip -l "build/orbitnet-${version}.zip" | tail -3

      # EVERY published asset, including the AssetLib zip. A consumer that pins this tag can fetch the
      # single zip -- which carries both addon directories and all six libraries -- and verify one digest,
      # rather than fetching six files and trusting the set was complete. Written after the zip is built,
      # so a tag commit cannot contain its own digest; main gets it one commit later. Harmless, because CI
      # builds rather than fetches.
      - name: Write the asset manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          {
            printf '{\n  "tag": "%s",\n  "assets": {\n' "$tag"
            first=1
            for f in build/orbitnet-*.zip addons/orbitnet_native/bin/* profiling/*; do
              name="$(basename "$f")"
              [ "$first" -eq 1 ] || printf ',\n'
              first=0
              printf '    "%s": { "size": %s, "sha256": "%s" }' \
                "$name" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            printf '\n  }\n}\n'
          } > addons/orbitnet_native/binaries.json
          cat addons/orbitnet_native/binaries.json

      - name: Commit the manifest to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # This checkout is the TAG and detached, so the manifest is replayed onto main rather than
          # pushed from here -- pushing a detached HEAD to main would move main to the tag.
          manifest="$(cat addons/orbitnet_native/binaries.json)"
          plugin="$(cat addons/orbitnet/plugin.cfg)"
          git fetch origin main
          git checkout -B release-manifest origin/main
          printf '%s' "$manifest" > addons/orbitnet_native/binaries.json
          printf '%s' "$plugin"   > addons/orbitnet/plugin.cfg
          git add addons/orbitnet_native/binaries.json addons/orbitnet/plugin.cfg
          if git diff --cached --quiet; then
            echo "manifest unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "release: binaries manifest and plugin version for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/orbitnet-*.zip
            addons/orbitnet_native/bin/*
            addons/orbitnet_native/binaries.json
            profiling/*
          generate_release_notes: true
          body: |
            ## Install

            **Asset Library:** download `orbitnet-*.zip` below and use *AssetLib → Install from file*, then
            enable **OrbitNet** in *Project → Project Settings → Plugins*.

            **Manual:** copy `addons/orbitnet/` and `addons/orbitnet_native/` from the zip into your project.
            Both directories are required — `Net` without the extension is a facade over nothing.

            The binaries in the zip are plain files, not Git LFS pointers: they work straight out of it.

            ## Pinning this release from a build

            `binaries.json` carries the size and sha256 of every asset on this release and is committed
            to `main`, so a fetch is verified against the commit graph rather than against a checksum
            published beside the file it describes.

            Fetch the **zip** to get both addon directories and all six libraries against one digest. The
            loose binaries are also attached individually, for a project that wants only the files its
            own `.gdextension` names.

            | Asset | What it is |
            | --- | --- |
            | `*.template_debug.*` | Loaded when a project runs from source. Carries `debug-assertions` and `overflow-checks`. |
            | `*.template_release.*` | Loaded by an exported game. |
            | `*.profiling.*` | Release build with debug information retained, for a native profiler. Not named by the descriptor. |

            OrbitNet is 0.x. The `Net` facade is the stable surface; everything behind it may change.
