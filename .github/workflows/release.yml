name: release

# Cut a release from a `v*` tag: build the extension on every platform leg, publish the binaries as
# Release assets, build the Asset Library zip, and commit a sha256 MANIFEST of what was published.
#
# NO BINARY IS COMMITTED, HERE OR ANYWHERE. What lands on main is `addons/orbitnet_native/binaries.json`
# -- the size and sha256 of every published asset -- plus the version this tag stamped, which is written
# to `addons/orbitnet/plugin.cfg`, `native/Cargo.toml` and `native/Cargo.lock`. A consumer pins the tag,
# downloads the assets and verifies them against a digest that lives in the commit graph, which a checksum
# file published beside the asset cannot do: that verifies transport, not tamper.
#
# The manifest is written AFTER the assets are built, so a tag commit cannot contain its own digest; main
# gets it one commit later. Harmless, because CI builds rather than fetches.
#
# THREE PROFILES. `template_debug` and `template_release` are what the .gdextension names and what the
# zip carries. `profiling` is a symbolized developer build, published as an asset only -- shipping it
# would put debug information nobody loads into every export. See tools/build-native.sh.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.2.0). Manual runs do not publish.'
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true   # a partial set of binaries must never be published
      matrix:
        include:
          # Tag pushes and workflow_dispatch both require write access to this repository, unlike
          # check.yml's pull_request gate -- see that file's header for why THAT one must stay
          # GitHub-hosted. There is no fork-PR path into this workflow, so the self-hosted fleet is safe
          # here.
          - platform: linux
            runner: [self-hosted, Linux, X64, legion]
          # LINUX ARM64 CROSS-COMPILES ON THE x86_64 BOX. Same runner labels as the leg above,
          # `aarch64-unknown-linux-gnu` as the cargo target, no arm64 hardware anywhere. `fail-fast: true`
          # above covers it like any other leg -- the descriptor names the arm64 libraries and the publish
          # job diffs the built set against the descriptor, so a tag that cannot produce them must not
          # publish the remaining platforms either. The box needs an aarch64 linker
          # (`gcc-aarch64-linux-gnu`); the build refuses to start without one rather than uploading an
          # empty artifact.
          - platform: linux_arm64
            runner: [self-hosted, Linux, X64, legion]
          - platform: windows
            runner: [self-hosted, Windows, X64, legion-win]
          - platform: macos
            runner: [self-hosted, macOS, ARM64, legion-mac]
          # The android ABIs cross-compile on the x86_64 Linux box too, one leg per ABI because Android
          # ships one .so per ABI and the descriptor names each one. They link with the NDK's clang
          # wrappers rather than a distribution cross gcc; the step below resolves or installs an NDK,
          # and the build refuses to start without one.
          - platform: android_arm64
            runner: [self-hosted, Linux, X64, legion]
          - platform: android_arm32
            runner: [self-hosted, Linux, X64, legion]
          - platform: android_x86_64
            runner: [self-hosted, Linux, X64, legion]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # NO dtolnay/rust-toolchain AND NO Swatinem/rust-cache ON THE SELF-HOSTED LEGS. Both exist to
      # provision a fresh hosted runner. These boxes already carry rustup and a persistent `target/`
      # directory, and both actions run `rustc` directly to build a cache key -- which is how a box whose
      # rustup SHIMS had gone missing failed here with "rustc: command not found" while `rustup toolchain
      # install` and `rustup default` both reported success. check.yml keeps the actions: it runs on
      # GitHub-hosted runners that genuinely start empty.
      #
      # `cargo` is what the build invokes, and the rustup cargo shim points rustc at the toolchain itself,
      # so cargo resolving is the condition that matters. native/rust-toolchain.toml pins the version;
      # rustup honors it from inside that directory with no help from CI.
      - name: Check the Rust toolchain on this runner
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            "$(command -v rustup >/dev/null 2>&1 && dirname "$(command -v rustup)" || true)" \
            "${CARGO_HOME:-}/bin" \
            "${USERPROFILE:-}/.cargo/bin" \
            "$HOME/.cargo/bin"
          do
            [ -n "$dir" ] && [ -d "$dir" ] || continue
            echo "-- $dir"
            ls -l "$dir" || true
            case ":$PATH:" in *":$dir:"*) ;; *) echo "$dir" >> "$GITHUB_PATH" ;; esac
            break
          done
          if ! command -v cargo >/dev/null 2>&1; then
            # THE RUSTUP PROXIES ARE MISSING, NOT THE TOOLCHAIN. rustup installs `cargo`, `rustc` and the
            # rest as copies of rustup.exe in the same directory; when those are deleted, `rustup` still
            # answers and reports its toolchains while nothing else on PATH exists. Observed on a runner
            # whose .cargo/bin held rustup.exe and nothing else.
            #
            # `rustup self update` reinstalls the proxies, which is the sanctioned repair. If it cannot
            # (offline, or a rustup installed by a package manager), the proxies are recreated directly --
            # copying rustup.exe under each name is exactly what rustup does internally.
            rustup_bin="$(command -v rustup || true)"
            if [ -z "$rustup_bin" ]; then
              echo "::error::neither cargo nor rustup is on this runner. Install rustup for the account the runner service runs as."
              exit 1
            fi
            bindir="$(dirname "$rustup_bin")"
            echo "::warning::cargo is missing from ${bindir}; repairing the rustup proxies"
            rustup self update || echo "rustup self update did not run; recreating the proxies directly"
            if ! command -v cargo >/dev/null 2>&1; then
              ext=""
              case "$rustup_bin" in *.exe) ext=".exe" ;; esac
              for tool in cargo rustc rustdoc rustfmt cargo-fmt cargo-clippy clippy-driver; do
                [ -e "${bindir}/${tool}${ext}" ] || cp "$rustup_bin" "${bindir}/${tool}${ext}"
              done
              chmod 0755 "${bindir}"/* 2>/dev/null || true
              hash -r 2>/dev/null || true
            fi
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo still does not resolve after repair. rustup=$(command -v rustup || echo none). Reinstall rustup for the account the runner service runs as."
            exit 1
          fi
          echo "cargo: $(command -v cargo)"
          # From inside native/, so the versions printed are the ones rust-toolchain.toml pins. `rustc`
          # is reported and not required: the rustup cargo shim resolves rustc for its own children, so a
          # missing rustc shim does not stop a build -- it only stops a step that runs rustc directly.
          ( cd native && cargo --version )
          ( cd native && rustc --version ) || echo "rustc does not resolve directly; cargo will resolve it"


      # THE aarch64 CROSS LINKER, WHICH `rustup target add` DOES NOT INSTALL. rustc shells out to a C
      # linker to produce a cdylib, and for a foreign architecture that linker carries the target's own
      # libc and crt objects -- a separate package, not part of the Rust toolchain. Without it this leg
      # fails inside tools/build-native.sh's preflight, which is where the failure belongs but not where
      # it can be fixed.
      #
      # IN CI RATHER THAN IN tools/build-native.sh. A build script that installs packages is a build
      # script that mutates a contributor's machine. The script keeps refusing and printing the install
      # line; provisioning a box this workflow already owns is the workflow's job.
      #
      # IDEMPOTENT, and a no-op on a box that already carries the linker -- including a native arm64
      # runner, where there is nothing to cross to.
      - name: Install the aarch64 cross linker
        if: matrix.platform == 'linux_arm64'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER:-}" ]; then
            echo "linker set in the environment: $CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER"
            exit 0
          fi
          for cc in aarch64-linux-gnu-gcc aarch64-unknown-linux-gnu-gcc aarch64-linux-gnu-cc; do
            if command -v "$cc" >/dev/null 2>&1; then
              echo "already installed: $(command -v "$cc")"
              exit 0
            fi
          done
          # `sudo -n`: a runner service must never sit at a password prompt. If it cannot elevate, say so
          # with the command to run by hand rather than hanging or guessing.
          sudo=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::no aarch64 cross linker and no sudo on this runner. Install it for the account"
              echo "the runner service runs as: gcc-aarch64-linux-gnu (apt/dnf) or aarch64-linux-gnu-gcc (pacman)."
              exit 1
            fi
            sudo="sudo -n"
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $sudo apt-get update
            $sudo apt-get install -y gcc-aarch64-linux-gnu
          elif command -v dnf >/dev/null 2>&1; then
            $sudo dnf install -y gcc-aarch64-linux-gnu
          elif command -v pacman >/dev/null 2>&1; then
            $sudo pacman -S --noconfirm aarch64-linux-gnu-gcc
          else
            echo "::error::no aarch64 cross linker, and no apt-get, dnf or pacman to install one."
            echo "This box uses another package manager. Install an aarch64 Linux GNU cross gcc for the"
            echo "account the runner service runs as, or export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER"
            echo "pointing at a linker it already has."
            exit 1
          fi
          command -v aarch64-linux-gnu-gcc

      # The Android NDK, which `rustup target add` does not install either. rustc shells out to a C
      # linker for a cdylib, and for an android ABI that linker is the NDK's clang wrapper, carrying
      # Bionic's libc and crt objects. Without one this leg fails in tools/build-native.sh's preflight,
      # which names the requirement but cannot satisfy it on a runner.
      #
      # Provisioning happens here rather than in tools/build-native.sh, for the same reason as the step
      # above: a `tools/` script that installed packages would mutate a contributor's machine.
      #
      # It calls tools/build-native.sh's own search rather than repeating it. A second copy that drifted
      # would fail a leg on a box the build itself can build on -- the box provisioned with the apt
      # package docs/building.md recommends, for instance, whose NDK lands somewhere a narrower search
      # never looks. The step exports ANDROID_NDK_HOME so the build resolves the same install it just
      # reported.
      #
      # The `sdkmanager` path is what the aarch64 step's `apt-get` path is: provisioning a box this
      # workflow already owns. An NDK is a licensed SDK component rather than a distribution package, so
      # a runner with no command-line tools cannot be provisioned from here and the step says what to
      # install instead.
      - name: Locate the Android NDK
        if: startsWith(matrix.platform, 'android')
        shell: bash
        env:
          # One edit moves every android leg to another NDK, and it is only what gets installed: a box
          # already carrying an NDK keeps it. Any r23 or newer works -- the clang wrappers this build
          # links with have been in the same place since the side-by-side layout arrived.
          ANDROID_NDK_VERSION: '26.3.11579264'
          # The same NDK as a downloadable archive, for a box with no `sdkmanager`. The two must name the
          # same release: r26d is 26.3.11579264.
          ANDROID_NDK_ARCHIVE: 'android-ndk-r26d-linux.zip'
          ANDROID_NDK_ARCHIVE_DIR: 'android-ndk-r26d'
        run: |
          set -euo pipefail
          ndk="$(tools/build-native.sh ndk-root)"
          installed=0
          if [ -z "$ndk" ] && command -v sdkmanager >/dev/null 2>&1; then
            echo "no NDK on this runner; installing ndk;${ANDROID_NDK_VERSION}"
            # Licences are accepted non-interactively for the same reason `sudo -n` is used above: a
            # runner service must never sit at a prompt. `|| true` because sdkmanager exits non-zero once
            # every licence is already accepted.
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
            installed=1
            ndk="$(tools/build-native.sh ndk-root)"
          fi

          # NO `sdkmanager`, SO FETCH THE ARCHIVE. The command-line tools are a separate download from the
          # NDK and a box can have the second without the first, which is what this fleet turned out to be.
          # Installing them to get a downloader is a longer road than downloading what they would fetch.
          #
          # It lands in `$HOME/Android/Sdk/ndk/<version>`, one of the directories `tools/build-native.sh
          # ndk-root` already searches, so nothing has to be told where it went. A box that already carries
          # it skips this entirely -- the runner is persistent, so the cost is paid once rather than per run.
          if [ -z "$ndk" ]; then
            dest="$HOME/Android/Sdk/ndk/${ANDROID_NDK_VERSION}"
            if [ ! -d "$dest" ]; then
              echo "no NDK and no sdkmanager; fetching ${ANDROID_NDK_ARCHIVE}"
              tmp="$(mktemp -d)"
              # Unpinned, like the Godot download this fleet already does in check.yml and netbench.yml.
              curl -fsSL -o "$tmp/ndk.zip" \
                "https://dl.google.com/android/repository/${ANDROID_NDK_ARCHIVE}"
              # `unzip` PREFERRED BECAUSE IT KEEPS THE MODE BITS. This box has neither `zip` nor `unzip` --
              # tools/make-assetlib-zip.py's header records the same discovery -- and python's zipfile
              # DROPS the executable bit, which the NDK's clang wrappers and `ndk-build` need. So the
              # fallback restores it on every `bin` directory rather than hoping.
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$tmp/ndk.zip" -d "$tmp"
              else
                python3 -m zipfile -e "$tmp/ndk.zip" "$tmp"
                find "$tmp/${ANDROID_NDK_ARCHIVE_DIR}" -type d -name bin -exec chmod -R +x {} +
                # An `if`, not `a && b`: the repository has been bitten by a false `&&` list under
                # `set -e` before, and these names differ between NDK releases.
                for f in ndk-build ndk-gdb ndk-stack ndk-which; do
                  if [ -e "$tmp/${ANDROID_NDK_ARCHIVE_DIR}/$f" ]; then
                    chmod +x "$tmp/${ANDROID_NDK_ARCHIVE_DIR}/$f"
                  fi
                done
              fi
              mkdir -p "$(dirname "$dest")"
              mv "$tmp/${ANDROID_NDK_ARCHIVE_DIR}" "$dest"
              rm -rf "$tmp"
            fi
            installed=1
            ndk="$(tools/build-native.sh ndk-root)"
          fi
          # Two distinct failures, because they need opposite responses. Telling an operator to install
          # command-line tools that are already present, on a run where sdkmanager just wrote an NDK,
          # sends them at the wrong thing.
          if [ -z "$ndk" ] && [ "$installed" -eq 1 ]; then
            echo "::error::sdkmanager installed ndk;${ANDROID_NDK_VERSION} and tools/build-native.sh still finds no NDK."
            echo "It searches ANDROID_NDK_HOME, ANDROID_NDK_ROOT, ANDROID_NDK, NDK_HOME and"
            echo 'ANDROID_NDK_LATEST_HOME, then ndk/<version> under ANDROID_SDK_ROOT, ANDROID_HOME,'
            echo '$HOME/Android/Sdk, $HOME/Library/Android/sdk, /usr/lib/android-sdk and /opt/android-sdk,'
            echo 'then /usr/lib/android-ndk and /opt/android-ndk*.'
            echo "sdkmanager wrote outside all of those. Set ANDROID_NDK_HOME on the runner to the"
            echo "directory it wrote, or point ANDROID_SDK_ROOT at the SDK it installed into."
            exit 1
          fi
          if [ -z "$ndk" ]; then
            echo "::error::no Android NDK on this runner, and neither sdkmanager nor the archive download"
            echo "produced one. This leg cross-compiles the extension for one android ABI and links it with"
            echo "the NDK's clang wrapper. Install the NDK for the account the runner service runs as --"
            echo "Android Studio's SDK Manager, or 'sdkmanager --install \"ndk;${ANDROID_NDK_VERSION}\"'"
            echo "from the command-line tools -- and set ANDROID_NDK_HOME to its root."
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ndk: $ndk"
          ls "$ndk/toolchains/llvm/prebuilt"

      - name: Build both descriptor profiles
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged

      # Separate directory, separate artifact: these must not reach the zip or the descriptor.
      - name: Build the symbolized profiling library
        shell: bash
        run: tools/build-native.sh build ${{ matrix.platform }} staged-profiling profiling

      # macOS debug information is a .dSYM BUNDLE -- a directory. A release asset is a single file, so it
      # is tarred here rather than at publish time, on the machine that produced it. One bundle per
      # release: the dylib is universal and so is its .dSYM, which carries a UUID for each slice.
      - name: Pack the macOS debug bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cd staged-profiling
          for d in *.dSYM; do
            [ -d "$d" ] || continue
            tar -czf "$d.tar.gz" "$d"
            rm -rf "$d"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-${{ matrix.platform }}
          path: staged/

      - uses: actions/upload-artifact@v4
        with:
          name: orbitnet-profiling-${{ matrix.platform }}
          path: staged-profiling/

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, legion]
    permissions:
      contents: write        # create the release, and push the manifest branch
      pull-requests: write   # main is protected, so the manifest arrives as a PR
    steps:
      # THE TAG, not main. This job assembles the zip from the working tree, and the binaries it downloads
      # were built from the tag's sources -- so checking out main shipped a zip pairing the tag's backend
      # with whatever GDScript main had drifted to. The manifest commit below re-targets main explicitly
      # rather than relying on this checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: orbitnet-*
          path: incoming
          merge-multiple: false

      # bin/ is gitignored and empty in a fresh checkout, so this is what fills it.
      - name: Install the binaries
        run: |
          set -euo pipefail
          mkdir -p addons/orbitnet_native/bin profiling
          # EVERY PLATFORM KEY THE BUILD MATRIX CARRIES, spelled the same way. A key missing from this
          # list leaves bin/ short of a library the descriptor names, and the next step fails the tag
          # after every build has already succeeded.
          for p in linux linux_arm64 windows macos android_arm64 android_arm32 android_x86_64; do
            cp incoming/orbitnet-$p/*            addons/orbitnet_native/bin/
            cp incoming/orbitnet-profiling-$p/*  profiling/
          done
          ls -l addons/orbitnet_native/bin profiling
          # A truncated download or an empty file here would publish a release that cannot load.
          for f in addons/orbitnet_native/bin/* profiling/*; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done

      # The bytes about to be published must be exactly the ones the descriptor names. A missing platform
      # or a renamed profile passes every Linux gate and fails at dlopen on a user's machine.
      - name: The published set is the set the descriptor names
        run: |
          set -euo pipefail
          named="$(grep -oE 'res://addons/orbitnet_native/bin/[^"]+' \
            addons/orbitnet_native/orbitnet.gdextension | sed 's|.*/||' | sort -u)"
          have="$(ls addons/orbitnet_native/bin | sort -u)"
          if ! diff <(printf '%s\n' "$named") <(printf '%s\n' "$have"); then
            echo "::error::the built set and the descriptor's set differ (< descriptor, > built)"
            exit 1
          fi
          echo "publishing exactly the $(printf '%s\n' "$named" | grep -c .) libraries the descriptor names"

      # INPUT_VERSION THROUGH THE ENVIRONMENT, NOT `${{ }}` INTERPOLATION. Expression interpolation
      # splices the value into the script SOURCE before bash parses it, so a crafted dispatch input
      # would run as code on a persistent self-hosted runner. Read as an env var it is data. The version
      # reaches tools/version-parity.sh as an ARGUMENT, which is data for the same reason, and that
      # script re-validates it against the same character set.
      #
      # BOTH VERSIONS, ONE SCRIPT. This used to stamp addons/orbitnet/plugin.cfg alone, so the cargo
      # workspace sat at 0.1.0 for every release the project cut and anything reading `CARGO_PKG_VERSION`
      # reported it. tools/version-parity.sh owns every site the version is written to -- plugin.cfg, the
      # `[workspace.package]` version in native/Cargo.toml, and the member entries in native/Cargo.lock --
      # and re-reads all of them afterwards, so a pattern that stopped matching fails the release instead
      # of publishing the old version.
      - name: Stamp the plugin and crate versions from the tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="${INPUT_VERSION#v}"
          fi
          case "$version" in
            ''|*[!A-Za-z0-9._-]*) echo "::error::refusing version '$version'"; exit 1 ;;
          esac
          tools/version-parity.sh stamp "$version"

      # tools/make-assetlib-zip.py RATHER THAN THE `zip` BINARY. The publish runner has neither `zip`
      # nor `unzip`: a dry run failed here with "zip: command not found" after all three cross-platform
      # builds had already succeeded. The script uses python3's standard library, needs no package
      # install, and counts the libraries it packaged rather than trusting the walk -- bin/ is
      # gitignored, so a clean checkout would otherwise ship an addon with no backend and say nothing.
      - name: Build the Asset Library zip
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="${INPUT_VERSION#v}"
          fi
          # The licenses ride INSIDE the payload: an addon installed from a zip carries no repository
          # with it, and a user who cannot find the terms will assume the worst.
          cp LICENSE LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md addons/orbitnet/
          tools/make-assetlib-zip.py "$version"
          rm -f addons/orbitnet/LICENSE addons/orbitnet/LICENSE-MIT \
                addons/orbitnet/LICENSE-APACHE addons/orbitnet/THIRD_PARTY.md

      # EVERY published asset, including the AssetLib zip. A consumer that pins this tag can fetch the
      # single zip -- which carries both addon directories and every descriptor library -- and verify one
      # digest, rather than fetching each file and trusting the set was complete. Written after the zip
      # is built, so a tag commit cannot contain its own digest; main gets it one commit later. Harmless,
      # because CI builds rather than fetches.
      - name: Write the asset manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          {
            printf '{\n  "tag": "%s",\n  "assets": {\n' "$tag"
            first=1
            for f in build/orbitnet-*.zip addons/orbitnet_native/bin/* profiling/*; do
              name="$(basename "$f")"
              [ "$first" -eq 1 ] || printf ',\n'
              first=0
              printf '    "%s": { "size": %s, "sha256": "%s" }' \
                "$name" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            printf '\n  }\n}\n'
          } > addons/orbitnet_native/binaries.json
          cat addons/orbitnet_native/binaries.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/orbitnet-*.zip
            addons/orbitnet_native/bin/*
            addons/orbitnet_native/binaries.json
            profiling/*
          generate_release_notes: true
          body: |
            ## Install

            **Asset Library:** download `orbitnet-*.zip` below and use *AssetLib → Install from file*, then
            enable **OrbitNet** in *Project → Project Settings → Plugins*.

            **Manual:** copy `addons/orbitnet/` and `addons/orbitnet_native/` from the zip into your project.
            Both directories are required — `Net` without the extension is a facade over nothing.

            The binaries in the zip are plain files, not Git LFS pointers: they work straight out of it.

            ## Pinning this release from a build

            `binaries.json` carries the size and sha256 of every asset on this release and is committed
            to `main`, so a fetch is verified against the commit graph rather than against a checksum
            published beside the file it describes.

            Fetch the **zip** to get both addon directories and every library the descriptor names against
            one digest. The loose binaries are also attached individually, for a project that wants only
            the files its own `.gdextension` names.

            | Asset | What it is |
            | --- | --- |
            | `*.template_debug.*` | Loaded when a project runs from source. Carries `debug-assertions` and `overflow-checks`. |
            | `*.template_release.*` | Loaded by an exported game. |
            | `*.profiling.*` | Release build with debug information retained, for a native profiler. Not named by the descriptor. |

            OrbitNet is 0.x. The `Net` facade is the stable surface; everything behind it may change.

      # AFTER the release exists, and as a PULL REQUEST. `main` is protected -- "Changes must be made
      # through a pull request" -- so a bot push is rejected with GH006 by construction, on every run
      # whose builds all succeeded. A step that can only pass by having nothing to push is not a guard.
      #
      # A SEPARATE WORKTREE, because this checkout is the TAG and it is dirty by now: plugin.cfg,
      # native/Cargo.toml and native/Cargo.lock carry the stamp and binaries.json is freshly written.
      # `git checkout -B` in this tree aborts whenever any of the four differs between the tag and main.
      #
      # AFTER the publish, because the release is the artifact that matters. This step failing must never
      # cost a full set of cross-platform builds and a tag that cannot be re-run.
      - name: Propose the manifest to main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="release-manifest/${GITHUB_REF_NAME}"
          wt="$RUNNER_TEMP/main-worktree"
          rm -rf "$wt"
          git worktree prune
          git fetch origin main
          git worktree add --detach "$wt" origin/main
          # `cp`, not a shell round trip: command substitution strips trailing newlines. binaries.json is
          # generated whole by this job, so copying it is the whole update.
          cp addons/orbitnet_native/binaries.json "$wt/addons/orbitnet_native/binaries.json"
          # THE VERSIONS ARE RE-STAMPED IN THE WORKTREE, NOT COPIED FROM THE TAG. plugin.cfg,
          # native/Cargo.toml and native/Cargo.lock are SOURCE files that main may have moved on since the
          # tag -- a reworded plugin description, a cargo profile added -- and copying the tag's copies
          # over them would revert that work as a side effect of a release. Re-running the stamp writes
          # the version fields and nothing else.
          #
          # THE CRATE VERSION MUST COME BACK TO MAIN, not only ride the tag. Stamped on the tag alone, the
          # workspace version returns to its old value on the next commit and the divergence reopens
          # immediately -- which is how it reached 0.1.0-against-0.4.0 in the first place. Carrying it here
          # is also what lets `just version-parity` pass on main at all.
          #
          # RE-RUNNING AN OLDER TAG'S JOB PROPOSES A DOWNGRADE. The stamp writes this tag's version into
          # the main worktree unconditionally, so re-running the job for an older tag after a newer one
          # has shipped opens a pull request moving all three version files backwards. The tree it writes
          # is internally consistent, so version-parity passes on it and does not catch it; main being
          # protected and the pull request being reviewed is what does. Close that pull request.
          "$wt/tools/version-parity.sh" stamp "${GITHUB_REF_NAME#v}"
          git -C "$wt" add addons/orbitnet_native/binaries.json addons/orbitnet/plugin.cfg \
                           native/Cargo.toml native/Cargo.lock
          if git -C "$wt" diff --cached --quiet; then
            echo "manifest unchanged; nothing to propose"
            git worktree remove --force "$wt"
            exit 0
          fi
          git -C "$wt" commit -m "release: binaries manifest and stamped versions for ${GITHUB_REF_NAME}"
          git -C "$wt" push --force origin "HEAD:refs/heads/${branch}"
          git worktree remove --force "$wt"
          # The API's answer decides this step's exit code. Piping curl into a printer exits 0 whatever
          # GitHub said, which is how v0.1.1's refusal ("GitHub Actions is not permitted to create or
          # approve pull requests") was reported as success while the manifest sat on an unmerged branch.
          # A pull request already open for this branch -- a re-run of the same tag -- is success.
          tools/propose-manifest-pr.py "${GITHUB_REPOSITORY}" "${branch}" main "${GITHUB_REF_NAME}"
