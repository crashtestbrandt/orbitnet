name: release

# Cut a release from a `v*` tag: build the extension on all three platforms, COMMIT the refreshed binaries
# to main, build the Asset Library zip, and publish a GitHub Release.
#
# This is the only workflow that writes to the repository, and the only one that grows history. Committing
# binaries here rather than on every push is what keeps a no-LFS repository small enough to stay pleasant to
# clone -- see the header of addons/orbitnet_native/orbitnet.gdextension for why LFS is not an option for an
# addon distributed through the Asset Library.
#
# The commit lands on the DEFAULT BRANCH, not on the tag: a tag is immutable and already points at the
# source the binaries were built from, while main is what a `git clone` gets. The tag's release assets carry
# the same binaries, so a user has both paths.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.2.0). Manual runs do not commit or publish.'
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true   # a partial set of binaries must never be committed
      matrix:
        include:
          - os: linux
            # Tag pushes and workflow_dispatch both require write access to this repository, unlike
            # check.yml's pull_request gate -- see that file's header for why THAT one must stay
            # GitHub-hosted. There is no fork-PR path into this workflow, so the self-hosted fleet is safe
            # here.
            runner: [self-hosted, Linux, X64, legion]
            artifact: liborbitnet.linux.x86_64.so
            built: native/target/release/liborbitnet.so
          - os: windows
            runner: [self-hosted, Windows, X64, legion-win]
            artifact: orbitnet.windows.x86_64.dll
            built: native/target/release/orbitnet.dll
          - os: macos
            runner: [self-hosted, macOS, ARM64, legion-mac]
            artifact: liborbitnet.macos.universal.dylib
            built: native/target/release/liborbitnet.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-${{ matrix.os }}

      # legion-mac is ARM64, but that is only the HOST -- both targets are cross-built and combined
      # regardless of which arch the runner is, same as binaries.yml.
      - name: Build (macOS universal)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          # `cd native` FIRST. native/rust-toolchain.toml pins the toolchain cargo uses in that directory,
          # while the repository root has no override and resolves to whatever rustup's default is. Running
          # `rustup target add` from the root installs the std libraries onto the DEFAULT toolchain, which the
          # pinned one cannot see, and the cross build then fails with "can't find crate for `std`" for
          # x86_64-apple-darwin on an arm64 runner.
          cd native
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release -p orbitnet-godot --target x86_64-apple-darwin
          cargo build --release -p orbitnet-godot --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/liborbitnet.dylib \
            target/x86_64-apple-darwin/release/liborbitnet.dylib \
            target/aarch64-apple-darwin/release/liborbitnet.dylib

      - name: Build
        if: matrix.os != 'macos'
        shell: bash
        run: cd native && cargo build --release -p orbitnet-godot

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp "${{ matrix.built }}" "staged/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staged/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, legion]
    permissions:
      contents: write   # the only place in this repo that needs it: commit binaries + create a release
    steps:
      # THE TAG, not main. This job assembles the zip from the working tree, and the binaries it downloads
      # were built from the tag's sources -- so checking out main shipped a zip pairing the tag's backend
      # with whatever GDScript main had drifted to. The manifest commit below re-targets main explicitly
      # rather than relying on this checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true

      - name: Install the binaries
        run: |
          set -euo pipefail
          mkdir -p addons/orbitnet_native/bin
          cp incoming/liborbitnet.linux.x86_64.so        addons/orbitnet_native/bin/
          cp incoming/orbitnet.windows.x86_64.dll        addons/orbitnet_native/bin/
          cp incoming/liborbitnet.macos.universal.dylib  addons/orbitnet_native/bin/
          ls -l addons/orbitnet_native/bin
          # A pointer, a truncated download, or an empty file here would ship a release that cannot load.
          for f in addons/orbitnet_native/bin/*; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done

      - name: Stamp the plugin version from the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
          fi
          sed -i "s/^version=\".*\"$/version=\"${version}\"/" addons/orbitnet/plugin.cfg
          grep '^version=' addons/orbitnet/plugin.cfg

      - name: Build the Asset Library zip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build
          # The payload is exactly the two addon directories -- what a user installs and nothing else.
          # The licences ride along inside it, because an addon installed from a zip carries no repository
          # with it and a user who cannot find the terms will assume the worst.
          cp LICENSE LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md addons/orbitnet/
          zip -qr "build/orbitnet-${version}.zip" addons/orbitnet addons/orbitnet_native
          rm -f addons/orbitnet/LICENSE addons/orbitnet/LICENSE-MIT \
                addons/orbitnet/LICENSE-APACHE addons/orbitnet/THIRD_PARTY.md
          unzip -l "build/orbitnet-${version}.zip" | tail -3

      # THE DIGEST, NOT THE BINARY. What lands on main is a manifest naming each published asset and its
      # sha256, plus the version this tag stamped into plugin.cfg. A consumer pins the tag and verifies the
      # bytes it fetched against a digest that lives in the commit graph, which a checksum file published
      # beside the asset cannot do -- that verifies transport, not tamper.
      #
      # The manifest is written AFTER the assets are built, so a tag commit cannot contain its own digest;
      # main gets it one commit later. Harmless, because CI builds rather than fetches.
      - name: Write the binaries manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          {
            printf '{\n  "tag": "%s",\n  "binaries": {\n' "$tag"
            first=1
            for f in addons/orbitnet_native/bin/*; do
              name="$(basename "$f")"
              [ "$first" -eq 1 ] || printf ',\n'
              first=0
              printf '    "%s": { "size": %s, "sha256": "%s" }' \
                "$name" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            printf '\n  }\n}\n'
          } > addons/orbitnet_native/binaries.json
          cat addons/orbitnet_native/binaries.json

      - name: Commit the manifest to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # This checkout is the TAG and detached, so the manifest is replayed onto main rather than
          # pushed from here -- pushing a detached HEAD to main would move main to the tag.
          manifest="$(cat addons/orbitnet_native/binaries.json)"
          plugin="$(cat addons/orbitnet/plugin.cfg)"
          git fetch origin main
          git checkout -B release-manifest origin/main
          printf '%s' "$manifest" > addons/orbitnet_native/binaries.json
          printf '%s' "$plugin"   > addons/orbitnet/plugin.cfg
          git add addons/orbitnet_native/binaries.json addons/orbitnet/plugin.cfg
          if git diff --cached --quiet; then
            echo "manifest unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "release: binaries manifest and plugin version for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/orbitnet-*.zip
            addons/orbitnet_native/bin/*
          generate_release_notes: true
          body: |
            ## Install

            **Asset Library:** download `orbitnet-*.zip` below and use *AssetLib → Install from file*, then
            enable **OrbitNet** in *Project → Project Settings → Plugins*.

            **Manual:** copy `addons/orbitnet/` and `addons/orbitnet_native/` from the zip into your project.
            Both directories are required — `Net` without the extension is a facade over nothing.

            The binaries are plain files, not Git LFS pointers: they work straight out of the zip.

            OrbitNet is 0.x. The `Net` facade is the stable surface; everything behind it may change.
