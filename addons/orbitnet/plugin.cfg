[plugin]

name="OrbitNet"
description="Rollback netcode for Godot 4: server-authoritative replication, owner prediction and reconciliation, batched delta state sync, clock discipline and interest management, over a native Rust GDExtension. Registers the `Net` autoload while enabled; the backend is reached only through net.gd (enforced by the net-check gate)."
author="crashtestbrandt"
version="0.1.1"
script="orbitnet.gd"
